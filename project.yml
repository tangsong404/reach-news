name: ReachNews
options:
  bundleIdPrefix: com.tangsong404
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentRegion: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: 10008
targets:
  ReachNews:
    type: application
    platform: iOS
    sources:
      - path: ReachNews
        excludes: [Resources]
      - path: ReachNews/Resources/Assets.xcassets
        buildPhase: resources
      - path: ReachNews/Resources/zh-Hans.lproj
        type: folder
        buildPhase: resources
      - path: ReachNews/Resources/en.lproj
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tangsong404.reachnews
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Reach News
        CFBundleIdentifier: com.tangsong404.reachnews
        CFBundlePackageType: APPL
        CFBundleExecutable: ReachNews
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "10008"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
  ReachNewsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReachNewsTests
      - path: Fixtures
        buildPhase: resources
    dependencies:
      - target: ReachNews
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ReachNewsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ReachNewsUITests]
    dependencies:
      - target: ReachNews
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ReachNews:
    build:
      targets:
        ReachNews: all
    test:
      targets:
        - ReachNewsTests
        - ReachNewsUITests
      gatherCoverageData: true
    archive:
      config: Release

