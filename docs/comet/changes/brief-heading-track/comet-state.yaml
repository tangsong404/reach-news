使用笼统网络错误文案。"},{"id":"A21","source":"brief.md","text":"创建频道超出上限时按 `channel_quota_exceeded` 提示「已达上限」，不当成网络错误。"},{"id":"A22","source":"brief.md","text":"单元测试覆盖注册请求编码与错误码到提示的映射。"},{"id":"A23","source":"brief.md","text":"退出登录后回到登录页，且「我的」页不再残留上一账号的用户名、邮箱、套餐与头像；重新登录另一账号时不显示旧账号信息。"},{"id":"A24","source":"brief.md","text":"收藏一条日报后，即使把首页列表滚动到别处或重进 App，收藏页仍能找到它（不再依赖首页已加载内容）。"},{"id":"A25","source":"brief.md","text":"收藏页按需拉取时显示加载态；单条拉取失败显示可重试的提示，不整页报错。"},{"id":"A26","source":"brief.md","text":"收藏页支持下拉刷新；取消收藏后该项立即从列表移除，全部取消后显示空态。"},{"id":"A27","source":"brief.md","text":"偏好的风格切换在两套之间生效且持久化；主题色切换后强调元素随之变化且持久化。"},{"id":"A28","source":"brief.md","text":"风格与主题色只影响观感，不改变任何信息结构与交互位置。"},{"id":"A29","source":"brief.md","text":"本机用 tree-sitter 静态解析全部 `.swift` 无新增 `ERROR` 节点；CI 结果出来前，构建与测试相关结论记为 `not-run`，不记为通过。"},{"id":"A30","source":"brief.md","text":"退出登录必须有二次确认，确认后才执行退出。"},{"id":"A31","source":"brief.md","text":"登录页：整个登录区域垂直居中；移除「Connect to Reach News」及底部 Enter/keychain 等解释性辅助文案；注册入口「No account yet…」使用下划线样式。"},{"id":"A32","source":"brief.md","text":"小标题后的 follow 按钮改为小铃铛图标；点击后弹出确认弹窗，确认后才进入频道创建页。"},{"id":"A33","source":"brief.md","text":"Filter 面板移除「N briefs」这类数量辅助文案。"},{"id":"A34","source":"brief.md","text":"Preferences：language/style 不再重复输入控件本身已经表达的提示文字；两套风格视觉差异扩大，主题色选择后当前设置页立即生效。"},{"id":"A35","source":"brief.md","text":"外链图标：每条链接后的图标放在其下划线视觉上方/相邻，不得只在整段末尾显示。"},{"id":"A36","source":"brief.md","text":"follow 必须紧跟小标题最后一个文本片段，并允许随标题换行，不得用 HStack 把按钮挤到整块最右侧。"},{"id":"A37","source":"brief.md","text":"**统一确认样式**：所有二次确认都不要系统 `confirmationDialog` / action sheet / 对话气泡形式，统一为**屏幕中央的圆角矩形卡片**，内容为问题文字 + 确认按钮（可带取消）。卡片垂直居中，不能贴顶或偏上。适用范围包括退出登录、小标题 follow 确认，以及任何其它确认入口。"},{"id":"A38","source":"brief.md","text":"**登录页品牌区恢复**：登录页顶部重新显示 Reach News 的 logo 图形与「Reach News」字标（此前整块被移除）。仍不恢复「Connect to Reach News」副标题与 Enter/keychain 等解释性辅助文案。"},{"id":"A39","source":"brief.md","text":"**小标题溢出**：详情页小标题文字横向溢出容器、戳出边界，需要按容器宽度正常换行；长标题多行时 follow 按钮跟随最后一行。"},{"id":"A40","source":"brief.md","text":"**追问入口位置**：详情页追问胶囊位置