确认后才执行退出。"},{"id":"A31","source":"brief.md","text":"登录页：整个登录区域垂直居中；移除「Connect to Reach News」及底部 Enter/keychain 等解释性辅助文案；注册入口「No account yet…」使用下划线样式。"},{"id":"A32","source":"brief.md","text":"小标题后的 follow 按钮改为小铃铛图标；点击后弹出确认弹窗，确认后才进入频道创建页。"},{"id":"A33","source":"brief.md","text":"Filter 面板移除「N briefs」这类数量辅助文案。"},{"id":"A34","source":"brief.md","text":"Preferences：language/style 不再重复输入控件本身已经表达的提示文字；两套风格视觉差异扩大，主题色选择后当前设置页立即生效。"},{"id":"A35","source":"brief.md","text":"外链图标：每条链接后的图标放在其下划线视觉上方/相邻，不得只在整段末尾显示。"},{"id":"A36","source":"brief.md","text":"follow 必须紧跟小标题最后一个文本片段，并允许随标题换行，不得用 HStack 把按钮挤到整块最右侧。"},{"id":"A37","source":"brief.md","text":"**统一确认样式**：所有二次确认都不要系统 `confirmationDialog` / action sheet / 对话气泡形式，统一为**屏幕中央的圆角矩形卡片**，内容为问题文字 + 确认按钮（可带取消）。卡片垂直居中，不能贴顶或偏上。适用范围包括退出登录、小标题 follow 确认，以及任何其它确认入口。"},{"id":"A38","source":"brief.md","text":"**登录页品牌区恢复**：登录页顶部重新显示 Reach News 的 logo 图形与「Reach News」字标（此前整块被移除）。仍不恢复「Connect to Reach News」副标题与 Enter/keychain 等解释性辅助文案。"},{"id":"A39","source":"brief.md","text":"**小标题溢出**：详情页小标题文字横向溢出容器、戳出边界，需要按容器宽度正常换行；长标题多行时 follow 按钮跟随最后一行。"},{"id":"A40","source":"brief.md","text":"**收藏入口缺失**：「我的 → 收藏」列表还在，但界面上没有任何地方可以收藏日报（详情页与列表都没有入口）。需要在日报详情页导航栏提供收藏按钮（已收藏 / 未收藏两态可辨），点击即切换并立即反映到「我的 → 收藏」。"},{"id":"A41","source":"brief.md","text":"**暗色模式配色**：暗色下画布 / 纸面 / 卡片 / 分隔线 / 正文 / 次要文字之间对比度不足，组件之间看不清。需要重新给出成对的暗色 token，保证层级可辨、正文与次要文字可读、强调色与状态色在暗底上可见。"},{"id":"A42","source":"brief.md","text":"**确认框回到原生**：所有二次确认改用 SwiftUI 原生 `.alert`——屏幕正中、系统圆角、**没有气泡尖角/箭头**。删掉上一轮的自定义卡片，也不再使用会贴边或带箭头的 `confirmationDialog`。"},{"id":"A43","source":"brief.md","text":"**铃铛位置**：必须紧贴小标题**最后一个文字**的右侧——单行时跟在这一行文字后面，多行折行时贴最后一行文字之后，不得停留在整块最右侧。并且要有**看得出的按钮外观**（底色或描边），让人知道可以点。"},{"id":"A44","source":"brief.md","text":"**收藏按钮**：图标取当前**主题色**，不再是固定中性色；点击时先弹原生确认框（收藏 / 取消收藏），确认后才切换。"},{"id":"A45","source":"brief.md","text":"**风格差异**：编辑风与简洁风的差异必须一眼可见——字形（衬线 / 无衬线）、底色与卡片层级、标题字重与字号都要区分开，不能只把底色微调几个色阶。"}],"children":null,"specChanges":[{"capability":"ios-client","operation":"modify","source":"