关滑块、层级徽标、连接器选择页底色同步适配。"}},{"sequence":55,"value":{"reason":"第六轮实机反馈（需求调整）：\n1) 确认框回到 SwiftUI 原生 .alert（屏幕正中、系统圆角、无气泡尖角）；不再用自定义卡片，也不再用会贴边/带箭头的 confirmationDialog。\n2) 铃铛必须紧贴小标题最后一个文字的右侧（多行时贴最后一行文字之后），不得停在整块最右；并且要有可见按钮外观。\n3) 收藏按钮图标跟随主题色，点击先弹原生确认框，确认后才切换收藏（原 A40 的「点击即切换」需要改）。\n4) 编辑风与简洁风差异必须一眼可见（字形、底色层级、标题字重字号），不能只微调底色。"}},{"sequence":57,"value":{"choice":"approved","proposal":{"input":{"artifactRootRef":"docs","name":"brief-heading-track","task":"详情页两件事：\n1) 正文链接当前几乎看不见：全局 tint 是近黑色，与正文同色。需要让链接可辨（下划线/强调色），点击仍用系统浏览器打开。\n2) 正文小标题显示下划线且可点击；点击弹出两个选项：「查看原文」与「跟踪事件」。\n   - 查看原文：按小标题文字在已加载的素材里匹配标题包含关系，命中则打开该素材原文；未命中不显示该选项。\n   - 跟踪事件：进入频道创建页，复用现有创建页并增加事件模式：标题取小标题文字，提示词预填跟踪该事件的模板，用户仍可修改。"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"正文里的行内链接在纸色底上视觉可辨（有颜色区分或下划线），点击仍由系统浏览器打开其 `url`。"},{"id":"A2","source":"brief.md","text":"正文小标题**不显示下划线、不可点击**，保持普通标题样式；标题右侧显示一个「跟踪」按钮。"},{"id":"A3","source":"brief.md","text":"点击标题右侧的「跟踪」按钮**直接进入频道创建页**，不出现任何弹窗或选择步骤。"},{"id":"A4","source":"brief.md","text":"界面上**不存在**「查看原文」入口，也不再为它做标题与素材的匹配。"},{"id":"A5","source":"brief.md","text":"「跟踪」按钮在任何小标题上都出现（不依赖素材数据），点击后创建页的名称与提示词均已预填。"},{"id":"A6","source":"brief.md","text":"创建页的名称等于该小标题文字，提示词等于跟踪该事件的预填模板。"},{"id":"A7","source":"brief.md","text":"预填的标题与提示词都可被用户直接修改，提交后按普通频道创建。"},{"id":"A8","source":"brief.md","text":"普通入口（频道页的 +）新建频道时，名称与提示词仍为空，不出现任何预填内容或事件模式痕迹。"},{"id":"A9","source":"brief.md","text":"不再有任何标题↔素材匹配逻辑；相关代码与类型应删除，不留下死代码。"},{"id":"A10","source":"brief.md","text":"中文与英文本地化键集完全一致，新增键两侧同时存在，界面无硬编码文案。"},{"id":"A11","source":"brief.md","text":"单元测试覆盖事件预填的标题与提示词生成；不再有匹配相关测试。"},{"id":"A12","source":"brief.md","text":"正文链接不再使用颜色区分：链接文字为正文色，带下划线，并在文字后显示外链图标（SF Symbols `arrow.up.forward.app`）；点击仍由系统浏览器打开。"},{"id":"A13","source":"brief.md","text":"「我的」页冷启动后用户名可见：会话恢复后立即取 `/api/v1/me`，取到前显示占位而不是空行。"},{"id":"A14","source":"brief.md","text":"套餐标识显示服务端 `tier` 原值（实测含 `admin`），客户端与界面均不出现 `pro`，也不把管理员档映射成 ultra。"},{"id":"A15","source":"brief.md","text":"`email` 为 `null` 时显