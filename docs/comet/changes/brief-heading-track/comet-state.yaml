Unit Tests","note":"同一 run 的 iOS Unit Tests job success（Run unit tests step success），包含本轮新增的 AppearanceTokensTests 与既有 LocalizationTests / BriefHeadingTests / SavedFeedTests 等。","result":"passed"},{"name":"GitHub Actions iOS Visual Preview","note":"同一 run 的 iOS Visual Preview job success（Build simulator app + Boot simulator and capture preview 均 success）。","result":"passed"},{"name":"GitHub Actions Android Compose APK","note":"同一 run 首次失败于 gradle wrapper --gradle-version 8.11.1（下载基础设施问题，与 android/ 代码无关，本轮未改 android）；rerun-failed-jobs 后该 job success，run 结论 completed success。","result":"passed"}],"knownLimits":["运行期 UI 的视觉与交互（确认卡是否居中、暗色观感、小标题换行与 follow 跟随、收藏按钮点击链路）需要真机或模拟器人工确认；本机是 Linux，没有 iOS 工具链。","「我的 → 收藏」在新增收藏后依赖重新进入页面时按 ID 拉取，未做跨页推送刷新。"],"requireIndependentReview":false,"summary":"按第五轮实机反馈完成实现：①新增统一的居中式二次确认卡（ConfirmationCard + confirmationCard 修饰符），替换退出登录、小标题 follow、取消订阅、fork、删除频道共 5 处 confirmationDialog；卡片固定为屏幕正中圆角矩形，问题文字 + 取消/确认两键。②登录页恢复品牌图形 + Reach News 字标（仍不恢复 Connect to Reach News 与 Enter/keychain 文案）。③详情页导航栏新增收藏按钮（bookmark / bookmark.fill），补上此前完全缺失的收藏入口，收藏后进入「我的 → 收藏」。④小标题改用 HeadingFollowLayout：先按容器宽度换行并给 follow 预留位置，文字不再横向溢出，follow 仍跟在最后一行文字之后，无 follow 时同样按容器宽度换行。⑤中性色/状态色/追问色/强调色全部改成亮暗成对 token，取值集中到 NeutralTokens / StatusTokens，新增 AppearanceTokensTests 用同一份数字校验对比度；品牌标识按外观取亮暗两版，开关滑块、层级徽标、连接器选择页底色同步适配。"},{"reason":"第六轮实机反馈（需求调整）：\n1) 确认框回到 SwiftUI 原生 .alert（屏幕正中、系统圆角、无气泡尖角）；不再用自定义卡片，也不再用会贴边/带箭头的 confirmationDialog。\n2) 铃铛必须紧贴小标题最后一个文字的右侧（多行时贴最后一行文字之后），不得停在整块最右；并且要有可见按钮外观。\n3) 收藏按钮图标跟随主题色，点击先弹原生确认框，确认后才切换收藏（原 A40 的「点击即切换」需要改）。\n4) 编辑风与简洁风差异必须一眼可见（字形、底色层级、标题字重字号），不能只微调底色。"},{"choice":"approved","proposal":{"input":{"artifactRootRef":"docs","name":"brief-heading-track","task":"详情页两件事：\n1) 正文链接当前几乎看不见：全局 tint 是近黑色，与正文同色。需要让链接可辨（下划线/强调色），点击仍用系统浏览器打开。\n2) 正文小标题显示下划线且可点击；点击弹出两个选项：「查看原文」与「跟踪事件」。\n   - 查看原文：按小标题文字在已加载的素材里匹配标题包含关系，命中则打开该素材原文；未命中不显示该选项。\n   - 跟踪事件：进入频道创建页，复用现有创建页并增加事件模式：标题取小标题文字，提示词预填跟踪该事件的模板，用户仍可修改。"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"正文里的行内链接在纸色底上视觉可辨（有颜色区分或下划线），点击仍由系统浏览器打开其 `url`。"},{"id":"A2","source":"brief.md","text":"正文小标题**不显示下划线、不可点击**，保持普通标题样式；标题右侧显示一个「跟踪」按钮。"},{"id":"A3","source":"brief.md","text":"点击标题右侧的「跟踪」按钮**直接进入频道创建页**，不出现任何弹窗或选择步骤。"},{"id":"A4","source":"brief.md","text":"界面上**不存在**「查看原文」入口，也不再为它做标题与素材的匹配。"},{"id":"A5","source":"brief.md","text":"「跟踪」按钮在任何小标题上都出现（不依赖素材数据），点击后创建页的名称与提示词均已预填。"},{"id":"A6","source":"brief.md","text":"创建页的名称等于该小标题文字，提示词等于跟踪该事件的预填模板。"},{"id":"A7","source":"brief.md","text":"预填的标题与提示词都可被用户直接修改，提交后按普通频道创建。"},{"id":"A8","source":"brief.md","text":"普通入口（频道页的 +）新建频道时，名称与提示词仍为空，不出现任何预填内容或事件模式痕迹。"},{"id":"A9","source":"brief.md","text":"不再有任何标题↔素材匹配逻辑；相关代码与类型应删除，不留下死代码。"},{"id":"A10","source":"brief.md","text":"中文与英文本地化键集完全一致，新增键两侧同时存在，界面无硬编码文案。"},{"id":"A11","source":"brief.md","text":"单元测试覆盖事件预填的标题与提示词生成；不再有匹配相关测试。"},{"id":"A12","source":"brief.md","text":"正文链接不再使用颜色区分：链接文字为正文色，带下划线，并在文字后显示外链图标（SF Symbols `arrow.up.forward.app`）；点击仍由系统浏览器打开。"},{"id":"A13","source":"brief.md","text":"「我的」页冷启动后用户名可见：会话恢复后立即取 `/api/v1/me`，取到前显示占位而不是空行。"},{"id":"A14","source":"brief.md","text":"套餐标识显示服务端 `tier` 原值（实测含 `admin`），客户端与界面均不出现 `pro`，也不把管理员档映射成 ultra。"},{"id":"A15","source":"brief.md","text":"`email` 为 `null` 时显示缺省占位，不出现空白行或字面 `null`。"},{"id":"A16","source":"brief.md","text":"头像请求返回 404 `avatar_not_found` 时按「没有头像」显示缺省图形。"},{"id":"A17","source":"brief.md","text":"追问入口、建频道上限按 `capabilities.ask` 与 `capabilities.channelLimit` 决定；`channelLimit` 为 `null` 时不限。"},{"id":"A18","source":"brief.md","text":"头像按 `avatarUrl` 加载；`null` 或加载失败显示缺省头像，不出现空白圆或破图。"},{"id":"A19","source":"brief.md","text":"登录页可进入注册页；注册成功直接进入 App，不再调用登录接口。"},{"id":"A20","source":"brief.md","text":"注册失败按服务端 code 给出逐项提示（邀请码、昵称、邮箱、密码四类），不使用笼统网络错误文案。"},{"id":"A21","source":"brief.md","text":"创建频道超出上限时按 `channel_quota_exceeded` 提示「已达上限」，不当成网络错误。"},{"id":"A22","source":"brief.md","text":"单元测试覆盖注册请求编码与错误码到提示的映射。"},{"id":"A23","source":"brief.md","text":"退出登录后回到登录页，且「我的」页不再残留上一账号的用户名、邮箱、套餐与头像；重新登录另一账号时不显示旧账号信息。"},{"id":"A24","source":"brief.md","text":"收藏一条日报后，即使把首页列表滚动到别处或重进 App，收藏页仍能找到它（不再依赖首页已加载内容）。"},{"id":"A25","source":"brief.md","text":"收藏页按需拉取时显示加载态；单条拉取失败显示可重试的提示，不整页报错。"},{"id":"A26","source":"brief.md","text":"收藏页支持下拉刷新；取消收藏后该项立即从列表移除，全部取消后显示空态。"},{"id":"A27","source":"brief.md","text":"偏好的风格切换在两套之间生效且持久化；主题色切换后强调元素随之变化且持久化。"},{"id":"A28","source":"brief.md","text":"风格与主题色只影响观感，不改变任何信息结构与交互位置。"},{"id":"A29","source":"brief.md","text":"本机用 tree-sitter 静态解析全部 `.swift` 无新增 `ERROR` 节点；CI 结果出来前，构建与测试相关结论记为 `not-run`，不记为通过。"},{"id":"A30","source":"brief.md","text":"退出登录必须有二次确认，确认后才执行退出。"},{"id":"A31","source":"brief.md","text":"登录页：整个登录区域垂直居中；移除「Connect to Reach News」及底部 Enter/keychain 等解释性辅助文案；注册入口「No account yet…」使用下划线样式。"},{"id":"A32","source":"brief.md","text":"小标题后的 follow 按钮改为小铃铛图标；点击后弹出确认弹窗，确认后才进入频道创建页。"},{"id":"A33","source":"brief.md","text":"Filter 面板移除「N briefs」这类数量辅助文案。"},{"id":"A34","source":"brief.md","text":"Preferences：language/style 不再重复输入控件本身已经表达的提示文字；两套风格视觉差异扩大，主题色选择后当前设置页立即生效。"},{"id":"A35","source":"brief.md","text":"外链图标：每条链接后的图标放在其下划线视觉上方/相邻，不得只在整段末尾显示。"},{"id":"A36","source":"brief.md","text":"follow 必须紧跟小标题最后一个文本片段，并允许随标题换行，不得用 HStack 把按钮挤到整块最右侧。"},{"id":"A37","source":"brief.md","text":"**统一确认样式**：所有二次确认都不要系统 `confirmationDialog` / action sheet / 对话气泡形式，统一为**屏幕中央的圆角矩形卡片**，内容为问题文字 + 确认按钮（可带取消）。卡片垂直居中，不能贴顶或偏上。适用范围包括退出登录、小标题 follow 确认，以及任何其它确认入口。"},{"id":"A38","source":"brief.md","text":"**登录页品牌区恢复**：登录页顶部重新显示 Reach News 的 logo 图形与「Reach News」字标（此前整块被移除）。仍不恢复「Connect to Reach News」副标题与 Enter/keychain 等解释性辅助文案。"},{"id":"A39","source":"brief.md","text":"**小标题溢出**：详情页小标题文字横向溢出容器、戳出边界，需要按容器宽度正常换行；长标题多行时 follow 按钮跟随最后一行。"},{"id":"A40","source":"brief.md","text":"**收藏入口缺失**：「我的 → 收藏」列表还在，但界面上没有任何地方可以收藏日报（详情页与列表都没有入口）。需要在日报详情页导航栏提供收藏按钮（已收藏 / 未收藏两态可辨），点击即切换并立即反映到「我的 → 收藏」。"},{"id":"A41","source":"brief.md","text":"**暗色模式配色**：暗色下画布 / 纸面 / 卡片 / 分隔线 / 正文 / 次要文字之间对比度不足，组件之间看不清。需要重新给出成对的暗色 token，保证层级可辨、正文与次要文字可读、强调色与状态色在暗底上可见。"},{"id":"A42","source":"brief.md","text":"**确认框回到原生**：所有二次确认改用 SwiftUI 原生 `.alert`——屏幕正中、系统圆角、**没有气泡尖角/箭头**。删掉上一轮的自定义卡片，也不再使用会贴边或带箭头的 `confirmationDialog`。"},{"id":"A43","source":"brief.md","text":"**铃铛位置**：必须紧贴小标题**最后一个文字**的右侧——单行时跟在这一行文字后面，多行折行时贴最后一行文字之后，不得停留在整块最右侧。并且要有**看得出的按钮外观**（底色或描边），让人知道可以点。"},{"id":"A44","source":"brief.md","text":"**收藏按钮**：图标取当前**主题色**，不再是固定中性色；点击时先弹原生确认框（收藏 / 取消收藏），确认后才切换。"},{"id":"A45","source":"brief.md","text":"**风格差异**：编辑风与简洁风的差异必须一眼可见——字形（衬线 / 无衬线）、底色与卡片层级、标题字重与字号都要区分开，不能只把底色微调几个色阶。"}],"children":null,"specChanges":[{"capability":"ios-client","operation":"modify","source":"specs/ios-client/spec.md"}]}}}},{"acceptance":[{"id":"A1","source":"brief.md","text":"正文里的行内链接在纸色底上视觉可辨（有颜色区分或下划线），点击仍由系统浏览器打开其 `url`。"},{"id":"A2","source":"brief.md","text":"正文小标题**不显示下划线、不可点击**，保持普通标题样式；标题右侧显示一个「跟踪」按钮。"},{"id":"A3","source":"brief.md","text":"点击标题右侧的「跟踪」按钮**直接进入频道创建页**，不出现任何弹窗或选择步骤。"},{"id":"A4","source":"brief.md","text":"界面上**不存在**「查看原文」入口，也不再为它做标题与素材的匹配。"},{"id":"A5","source":"brief.md","text":"「跟踪」按钮在任何小标题上都出现（不依赖素材数据），点击后创建页的名称与提示词均已预填。"},{"id":"A6","source":"brief.md","text":"创建页的名称等于该小标题文字，提示词等于跟踪该事件的预填模板。"},{"id":"A7","source":"brief.md","text":"预填的标题与提示词都可被用户直接修改，提交后按普通频道创建。"},{"id":"A8","source":"brief.md","text":"普通入口（频道页的 +）新建频道时，名称与提示词仍为空，不出现任何预填内容或事件模式痕迹。"},{"id":"A9","source":"brief.md","text":"不再有任何标题↔素材匹配逻辑；相关代码与类型应删除，不留下死代码。"},{"id":"A10","source":"brief.md","text":"中文与英文本地化键集完全一致，新增键两侧同时存在，界面无硬编码文案。"},{"id":"A11","source":"brief.md","text":"单元测试覆盖事件预填的标题与提示词生成；不再有匹配相关测试。"},{"id":"A12","source":"brief.md","text":"正文链接不再使用颜色区分：链接文字为正文色，带下划线，并在文字后显示外链图标（SF Symbols `arrow.up.forward.app`）；点击仍由系统浏览器打开。"},{"id":"A13","source":"brief.md","text":"「我的」页冷启动后用户名可见：会话恢复后立即取 `/api/v1/me`，取到前显示占位而不是空行。"},{"id":"A14","source":"brief.md","text":"套餐标识显示服务端 `tier` 原值（实测含 `admin`），客户端与界面均不出现 `pro`，也不把管理员档映射成 ultra。"},{"id":"A15","source":"brief.md","text":"`email` 为 `null` 时显示缺省占位，不出现空白行或字面 `null`。"},{"id":"A16","source":"brief.md","text":"头像请求返回 404 `avatar_not_found` 时按「没有头像」显示缺省图形。"},{"id":"A17","source":"brief.md","text":"追问入口、建频道上限按 `capabilities.ask` 与 `capabilities.channelLimit` 决定；`channelLimit` 为 `null` 时不限。"},{"id":"A18","source":"brief.md","text":"头像按 `avatarUrl` 加载；`null` 或加载失败显示缺省头像，不出现空白圆或破图。"},{"id":"A19","source":"brief.md","text":"登录页可进入注册页；注册成功直接进入 App，不再调用登录接口。"},{"id":"A20","source":"brief.md","text":"注册失败按服务端 code 给出逐项提示（邀请码、昵称、邮箱、密码四类），不使用笼统网络错误文案。"},{"id":"A21","source":"brief.md","text":"创建频道超出上限时按 `channel_quota_exceeded` 提示「已达上限」，不当成网络错误。"},{"id":"A22","source":"brief.md","text":"单元测试覆盖注册请求编码与错误码到提示的映射。"},{"id":"A23","source":"brief.md","text":"退出登录后回到登录页，且「我的」页不再残留上一账号的用户名、邮箱、套餐与头像；重新登录另一账号时不显示旧账号信息。"},{"id":"A24","source":"brief.md","text":"收藏一条日报后，即使把首页列表滚动到别处或重进 App，收藏页仍能找到它（不再依赖首页已加载内容）。"},{"id":"A25","source":"brief.md","text":"收藏页按需拉取时显示加载态；单条拉取失败显示可重试的提示，不整页报错。"},{"id":"A26","source":"brief.md","text":"收藏页支持下拉刷新；取消收藏后该项立即从列表移除，全部取消后显示空态。"},{"id":"A27","source":"brief.md","text":"偏好的风格切换在两套之间生效且持久化；主题色切换后强调元素随之变化且持久化。"},{"id":"A28","source":"brief.md","text":"风格与主题色只影响观感，不改变任何信息结构与交互位置。"},{"id":"A29","source":"brief.md","text":"本机用 tree-sitter 静态解析全部 `.swift` 无新增 `ERROR` 节点；CI 结果出来前，构建与测试相关结论记为 `not-run`，不记为通过。"},{"id":"A30","source":"brief.md","text":"退出登录必须有二次确认，确认后才执行退出。"},{"id":"A31","source":"brief.md","text":"登录页：整个登录区域垂直居中；移除「Connect to Reach News」及底部 Enter/keychain 等解释性辅助文案；注册入口「No account yet…」使用下划线样式。"},{"id":"A32","source":"brief.md","text":"小标题后的 follow 按钮改为小铃铛图标；点击后弹出确认弹窗，确认后才进入频道创建页。"},{"id":"A33","source":"brief.md","text":"Filter 面板移除「N briefs」这类数量辅助文案。"},{"id":"A34","source":"brief.md","text":"Preferences：language/style 不再重复输入控件本身已经表达的提示文字；两套风格视觉差异扩大，主题色选择后当前设置页立即生效。"},{"id":"A35","source":"brief.md","text":"外链图标：每条链接后的图标放在其下划线视觉上方/相邻，不得只在整段末尾显示。"},{"id":"A36","source":"brief.md","text":"follow 必须紧跟小标题最后一个文本片段，并允许随标题换行，不得用 HStack 把按钮挤到整块最右侧。"},{"id":"A37","source":"brief.md","text":"**统一确认样式**：所有二次确认都不要系统 `confirmationDialog` / action sheet / 对话气泡形式，统一为**屏幕中央的