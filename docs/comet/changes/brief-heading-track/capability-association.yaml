query: 详情页两件事： 1) 正文链接当前几乎看不见：全局 tint 是近黑色，与正文同色。需要让链接可辨（下划线/强调色），点击仍用系统浏览器打开。
  2) 正文小标题显示下划线且可点击；点击弹出两个选项：「查看原文」与「跟踪事件」。 -
  查看原文：按小标题文字在已加载的素材里匹配标题包含关系，命中则打开该素材原文；未命中不显示该选项。 -
  跟踪事件：进入频道创建页，复用现有创建页并增加事件模式：标题取小标题文字，提示词预填跟踪该事件的模板，用户仍可修改。
