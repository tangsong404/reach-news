    title: iOS 客户端完整规格
    snippet: >-
      # iOS 客户端完整规格


      本 capability 描述重构后 iOS 客户端在归档时应具备的完整行为。数据来自 `reachapi.niuma.art` 的
      `/api/v1`，界面依据 `design/mockups/v2.html`，行为约束来自
      `docs/client-contract.md`、`docs/adr/` 与 `GLOSSARY.md`。


      ## 领域模型


      客户端在与服务端边界处一次性完成归一化，内部只使用本节的类型与命名。术语严格遵循 `GLOSSARY.md`：`items` 在日报 payload
      里是**条目**（`Entry`），`itemId` 指向的是**素材**（`Material`），两者不可混称。


      - `Channel`：`id`、`name`、`prompt`、`tone`、`schedule: Schedule`、`enabled:
      Bool`、`connectorIDs: [String]`、`lastBriefAt: Date?`、`kind:
      ChannelKind`、`published: Bool`、`owner: ChannelOwner`、`subscribed:
      Bool`、`subscriptionColor: String?`、`subscriptionID:
      String?`、`createdAt`、`up
  - source: docs/comet/archive/2026-11-21-redesign-ios-client/specs/ios-client/spec.md
