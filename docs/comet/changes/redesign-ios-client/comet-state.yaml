真实频道与真实日报列表，列表按日期倒序分组，今天与昨天用相对词、更早用日期。"},{"id":"A4","source":"brief.md","text":"元信息行显示当天日期星期、频道总数、已加载期数与「最新优先」。"},{"id":"A5","source":"brief.md","text":"每条行显示标题、频道标识点与频道名、Asia/Shanghai 时刻、分组数、素材数。"},{"id":"A6","source":"brief.md","text":"同一 `channelId` 在列表、详情、编辑页使用同一个标识色。"},{"id":"A7","source":"brief.md","text":"滚动到底部自动加载下一页，加载中显示指示，到达边界显示无更多内容。"},{"id":"A8","source":"brief.md","text":"下拉刷新重取最新并按 ID 合并，不产生重复行。"},{"id":"A9","source":"brief.md","text":"搜索按标题过滤已加载内容，无匹配时显示空结果说明。"},{"id":"A10","source":"brief.md","text":"筛选面板可从底部升起，时间单选（全部/本周/本月/近三个月/自定义范围）、频道多选，页脚显示随选择实时更新的「显示 N 期」。"},{"id":"A11","source":"brief.md","text":"选择早于已加载边界的范围时，客户端继续加载直到覆盖范围起点或到达数据边界，再呈现结果。"},{"id":"A12","source":"brief.md","text":"详情头部显示标题、`M月d日 HH:mm`、分组数、素材数。"},{"id":"A13","source":"brief.md","text":"分组标题吸顶并带背景模糊，显示分组名与「N 条」。"},{"id":"A14","source":"brief.md","text":"条目卡显示标题、摘要、素材数；展开后内联显示素材行。"},{"id":"A15","source":"brief.md","text":"素材行只显示标题与域名，点开外跳浏览器，正文从不出现在应用内。"},{"id":"A16","source":"brief.md","text":"日报详情右下角有追问胶囊，静止展开、滚动收起为圆形，停止滚动后恢复。"},{"id":"A17","source":"brief.md","text":"追问页使用与日报不同的近单色 token 组，含日期分隔、左右气泡与底部加号/输入框/麦克风。"},{"id":"A18","source":"brief.md","text":"发送后直接呈现服务端返回的回答，全程没有「正在思考」或逐字输出。"},{"id":"A19","source":"brief.md","text":"稿件中的引用素材卡按稿子留位并显示「功能开发中」，卡内不填任何素材。"},{"id":"A20","source":"brief.md","text":"频道卡显示标识点、名称、跟踪徽标、开关、提示词、状态 chip 与时间表描述。"},{"id":"A21","source":"brief.md","text":"切换开关即时生效；请求失败时回滚到原状态并提示原因。"},{"id":"A22","source":"brief.md","text":"运行中 chip 用绿色系，错过用中性灰，失败用警示色。"},{"id":"A23","source":"brief.md","text":"运行状态轮询只作用于屏幕内可见行，离开页面即停。"},{"id":"A24","source":"brief.md","text":"编辑页可改名称、提示词、口吻、时间表，连接器只读并注明需在管理后台调整。"},{"id":"A25","source":"brief.md","text":"保存只提交被改动的字段。"},{"id":"A26","source":"brief.md","text":"频道运行中保存返回 409 时，顶部出现提示且已填内容全部保留。"},{"id":"A27","source":"brief.md","text":"频道列表的 `+` 新建入口可见，点击说明功能开发中，不提供保存路径。"},{"id":"A28","source":"brief.md","text":"首次启动无 token 进入连接页，Base URL 预填 `reachapi.niuma.art` 且可编辑。"},{"id":"A29","source":"brief.md","text":"连接时先 `/health` 再 `/api/v1/channels` 双验证，两者都通过才写入 Keychain。"},{"id":"A30","source":"brief.md","text":"任一验证失败给出对应原因，且不覆盖已有凭证。"},{"id":"A31","source":"brief.md","text":"所有 `/api/v1` 请求带 Bearer，且不访问 `/admin/api/*`。"},{"id":"A32","source":"brief.md","text":"断网时下拉刷新显示「当前无网络」，不出现任何历史内容。"},{"id":"A33","source":"brief.md","text":"客户端不缓存日报与素材内容；`lastSeenAt` 作为轮询基线独立命名与存储。"},{"id":"A34","source":"brief.md","text":"轮询总是带 `since`，并以响应中最大的 `created_at` 推进，不用本地时间。"},{"id":"A35","source":"brief.md","text":"分页参数永不为 0、负数或超过 100，且不缓存负 `cursor`。"},{"id":"A36","source":"brief.md","text":"`missedReason` 与 `error.code` 的未知值保留原始字符串，不丢弃。"},{"id":"A37","source":"brief.md","text":"「我的」包含收藏列表、界面语言与 Base URL 偏好、当前服务地址与更换凭证入口。"},{"id":"A38","source":"brief.md","text":"收藏仅存本机，不同步服务端，可取消收藏并进入对应日报。"},{"id":"A39","source":"brief.md","text":"单元测试覆盖 DTO 解码、时间解析、未知枚举保留、分页参数、`lastSeenAt` 推进、筛选去重、编辑只提交改动字段与 409 不丢输入。"},{"id":"A40","source":"brief.md","text":"`android/**` 相对改动前字节不变，且 CI 的 `assembleDebug` 通过。"},{"id":"A41","source":"brief.md","text":"GitHub Actions 的 iOS 任务实际执行测试并给出通过结果，而非只做 archive。"},{"id":"A42","source":"brief.md","text":"中英文键集完全对齐，界面无硬编码文案。"}],"children":null,"specChanges":[{"capability":"ios-client","operation":"create","source":"specs/ios-client/spec.md"}]},"status":"succeeded"},"protocolVersion":1,"receipts":[{"hash":"0da0cbe262ac626aceba377512638177c7ad8e2477d3aedf0a69702e994628b1","outcomeId":"3082730a-5004-4ef0-9620-a4472098491f"}],"reconciliations":[],"ref":"native-shape-prepare","requiredCapabilities":[],"retry":"manual","runId":"redesign-ios-client","status":"succeeded","stepId":"shape.prepare","type":"call_tool"},{"attempt":1,"claim":{"executorId":"native-host","sessionId":"session-74b09858-67e7-4862-a80d-d6b67518d13b","token":"portable-912f79aacf41a47e39ee428c74b5f008c3005f6933bf80f65a27114b2eb33416"},"executionOrigin":{"workflow":{"hash":"a4e64ffbd76a550331a69bca1a149bcae73b6fabe8117152be4bfc1abf28d8eb","id":"comet-native","version":"4"}},"id":"redesign-ios-client:7","input":{"inp