素材行。"},{"id":"A15","source":"brief.md","text":"素材行只显示标题与域名，点开外跳浏览器，正文从不出现在应用内。"},{"id":"A16","source":"brief.md","text":"日报详情右下角有追问胶囊，静止展开、滚动收起为圆形，停止滚动后恢复。"},{"id":"A17","source":"brief.md","text":"追问页使用与日报不同的近单色 token 组，含日期分隔、左右气泡与底部输入栏。"},{"id":"A18","source":"brief.md","text":"发送后直接呈现服务端返回的回答，全程没有正在思考或逐字输出。"},{"id":"A19","source":"brief.md","text":"追问回答下方显示引用的素材卡，按 citedItemIds 渲染标题与来源域，无引用时显示空态。"},{"id":"A20","source":"brief.md","text":"频道卡显示标识点、名称、跟踪徽标、开关、提示词、状态 chip 与时间表描述。"},{"id":"A21","source":"brief.md","text":"切换开关即时生效；请求失败时回滚到原状态并提示原因。"},{"id":"A22","source":"brief.md","text":"运行中 chip 用绿色系，错过用中性灰，失败用警示色。"},{"id":"A23","source":"brief.md","text":"运行状态轮询只作用于屏幕内可见行，离开页面即停。"},{"id":"A24","source":"brief.md","text":"编辑页可改名称、提示词、口吻、时间表，连接器只读并注明需在管理后台调整。"},{"id":"A25","source":"brief.md","text":"保存只提交被改动的字段。"},{"id":"A26","source":"brief.md","text":"频道运行中保存返回 409 时，顶部出现提示且已填内容全部保留。"},{"id":"A27","source":"brief.md","text":"频道列表的新建入口可打开新建页，列出服务端预设模板并可实例化成自己的频道。"},{"id":"A28","source":"brief.md","text":"首次启动无会话进入登录页，Base URL 预填 reachapi.niuma.art 且可编辑。"},{"id":"A29","source":"brief.md","text":"登录通过 POST /api/v1/login 账号密码换取会话凭证，成功才写入 Keychain。"},{"id":"A30","source":"brief.md","text":"登录失败不写入凭证，且不区分用户不存在与密码错误。"},{"id":"A31","source":"brief.md","text":"所有 /api/v1 请求带 Bearer 会话凭证，且不访问 /admin 路径。"},{"id":"A32","source":"brief.md","text":"断网时下拉刷新显示当前无网络，不出现任何历史内容。"},{"id":"A33","source":"brief.md","text":"客户端不缓存日报与素材内容；lastSeenAt 作为轮询基线独立命名与存储。"},{"id":"A34","source":"brief.md","text":"轮询总是带 since，并以响应中最大的 created_at 推进，不用本地时间。"},{"id":"A35","source":"brief.md","text":"分页参数永不为 0、负数或超过 100，且不缓存负 cursor。"},{"id":"A36","source":"brief.md","text":"missedReason 与 error.code 的未知值保留原始字符串，不丢弃。"},{"id":"A37","source":"brief.md","text":"「我的」包含收藏列表、界面语言与 Base URL 偏好、当前服务地址与退出登录入口。"},{"id":"A38","source":"brief.md","text":"收藏仅存本机，不同步服务端，可取消收藏并进入对应日报。"},{"id":"A39","source":"brief.md","text":"单元测试覆盖 DTO 解码、时间解析、未知枚举保留、分页参数、lastSeenAt 推进、筛选去重、编辑只提交改动字段与 409 不丢输入。"},{"id":"A40","source":"brief.md","text":"android 目录相对改动前字节不变，且 CI 的 assembleDebug 通过。"},{"id":"A41","source":"brief.md","text":"GitHub Actions 的 iOS 任务实际执行测试并给出通过结果，而非只做 archive。"},{"id":"A42","source":"brief.md","text":"中英文键集完全对齐，界面无硬编码文案。"},{"id":"A43","source":"brief.md","text":"频道编辑页提供删除频道，经二次确认后调用 DELETE /api/v1/channels/:id。"},{"id":"A44","source":"brief.md","text":"删除成功后该频道从列表消失并返回列表页；服务端 404 按已删除处理，409 提示运行未结束且不删除。"},{"id":"A45","source":"brief.md","text":"频道列表显示按服务端时区触发，时区取自 GET /api/v1/settings 且随配置变化。"},{"id":"A46","source":"brief.md","text":"采集时间表与日期分组按服务端返回的时区解释；接口失败时回退 Asia/Shanghai 且不阻断主流程。"}],"children":null,"specChanges":[{"capability":"ios-client","operation":"create","source":"specs/ios-client/spec.md"}]}}}}},{"sequence":13,"value":{"acceptance":[{"id":"A1","source":"brief.md","text":"应用有日报、频道、我的三个标签，各自独立的导航栈；导航栏与标签栏为系统半透明玻璃。"},{"id":"A2","source":"brief.md","text":"导航栏品牌区显示品牌图形与「Reach News」字标。"},{"id":"A3","source":"brief.md","text":"带有效账号登录后能看到真实频道与真实日报列表，按日期倒序分组，今天与昨天用相对词、更早用日期。"},{"id":"A4","source":"brief.md","text":"元信息行显示当天日期星期、频道总数、已加载期数与最新优先。"},{"id":"A5","source":"brief.md","text":"每条行显示标题、频道标识点与频道名、按服务端时区的时刻、分组数、素材数。"},{"id":"A6","source":"brief.md","text":"同一 channelId 在列表、详情、编辑页使用同一个标识色。"},{"id":"A7","source":"brief.md","text":"滚动到底部自动加载下一页，加载中显示指示，到达边界显示无更多内容。"},{"id":"A8","source":"brief.md","text":"下拉刷新重取最新并按 ID 合并，不产生重复行。"},{"id":"A9","source":"brief.md","text":"搜索按标题过滤已加载内容，无匹配时显示空结果说明。"},{"id":"A10","source":"brief.md","text":"筛选面板可从底部升起，时间单选、频道多选，页脚显示随选择实时更新的显示 N 期。"},{"id":"A11","source":"brief.md","text":"选择早于已加载边界的范围时，客户端继续加载直到覆盖范围起点或到达数据边界，再呈现结果。"},{"id":"A12","source":"brief.md","text":"详情头部显示标题、月日与时刻、分组数、素材数。"},{"id":"A13","source":"brief.md","text":"分组标题吸顶并带背景模糊，显示分组名与条数。"},{"id":"A14","source":"brief.md","text":"条目卡显示标题、摘要、素材数；展开后内联显示素材行。"},{"id":"A15","source":"brief.md","text":"素材行只显示标题与域名，点开外跳浏览器，正文从不出现在应用内。"},{"id":"A16","source":"brief.md","text":"日报详情右下角有追问胶囊，静止展开、滚动收起为圆形，停止滚动后恢复。"},{"id":"A17","source":"brief.md","text":"追问页使用与