eenAt` 作为轮询基线独立命名与存储。"},{"id":"A34","source":"brief.md","text":"轮询总是带 `since`，并以响应中最大的 `created_at` 推进，不用本地时间。"},{"id":"A35","source":"brief.md","text":"分页参数永不为 0、负数或超过 100，且不缓存负 `cursor`。"},{"id":"A36","source":"brief.md","text":"`missedReason` 与 `error.code` 的未知值保留原始字符串，不丢弃。"},{"id":"A37","source":"brief.md","text":"「我的」包含收藏列表、界面语言与 Base URL 偏好、当前服务地址与更换凭证入口。"},{"id":"A38","source":"brief.md","text":"收藏仅存本机，不同步服务端，可取消收藏并进入对应日报。"},{"id":"A39","source":"brief.md","text":"单元测试覆盖 DTO 解码、时间解析、未知枚举保留、分页参数、`lastSeenAt` 推进、筛选去重、编辑只提交改动字段与 409 不丢输入。"},{"id":"A40","source":"brief.md","text":"`android/**` 相对改动前字节不变，且 CI 的 `assembleDebug` 通过。"},{"id":"A41","source":"brief.md","text":"GitHub Actions 的 iOS 任务实际执行测试并给出通过结果，而非只做 archive。"},{"id":"A42","source":"brief.md","text":"中英文键集完全对齐，界面无硬编码文案。"}],"children":null,"specChanges":[{"capability":"ios-client","operation":"create","source":"specs/ios-client/spec.md"}]}}}}},{"sequence":5,"value":{"acceptance":[{"id":"A1","source":"brief.md","text":"应用有日报、频道、我的三个标签，各自独立的导航栈；导航栏与标签栏为系统半透明玻璃，内容从其下方滚过。"},{"id":"A2","source":"brief.md","text":"导航栏品牌区显示品牌图形与「Reach News」字标。"},{"id":"A3","source":"brief.md","text":"带有效 token 启动，能看到真实频道与真实日报列表，列表按日期倒序分组，今天与昨天用相对词、更早用日期。"},{"id":"A4","source":"brief.md","text":"元信息行显示当天日期星期、频道总数、已加载期数与「最新优先」。"},{"id":"A5","source":"brief.md","text":"每条行显示标题、频道标识点与频道名、Asia/Shanghai 时刻、分组数、素材数。"},{"id":"A6","source":"brief.md","text":"同一 `channelId` 在列表、详情、编辑页使用同一个标识色。"},{"id":"A7","source":"brief.md","text":"滚动到底部自动加载下一页，加载中显示指示，到达边界显示无更多内容。"},{"id":"A8","source":"brief.md","text":"下拉刷新重取最新并按 ID 合并，不产生重复行。"},{"id":"A9","source":"brief.md","text":"搜索按标题过滤已加载内容，无匹配时显示空结果说明。"},{"id":"A10","source":"brief.md","text":"筛选面板可从底部升起，时间单选（全部/本周/本月/近三个月/自定义范围）、频道多选，页脚显示随选择实时更新的「显示 N 期」。"},{"id":"A11","source":"brief.md","text":"选择早于已加载边界的范围时，客户端继续加载直到覆盖范围起点或到达数据边界，再呈现结果。"},{"id":"A12","source":"brief.md","text":"详情头部显示标题、`M月d日 HH:mm`、分组数、素材数。"},{"id":"A13","source":"brief.md","text":"分组标题吸顶并带背景模糊，显示分组名与「N 条」。"},{"id":"A1