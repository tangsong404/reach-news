文从不出现在应用内。"},{"id":"A16","source":"brief.md","text":"日报详情右下角有追问胶囊，静止展开、滚动收起为圆形，停止滚动后恢复。"},{"id":"A17","source":"brief.md","text":"追问页使用与日报不同的近单色 token 组，含日期分隔、左右气泡与底部加号/输入框/麦克风。"},{"id":"A18","source":"brief.md","text":"发送后直接呈现服务端返回的回答，全程没有「正在思考」或逐字输出。"},{"id":"A19","source":"brief.md","text":"稿件中的引用素材卡按稿子留位并显示「功能开发中」，卡内不填任何素材。"},{"id":"A20","source":"brief.md","text":"频道卡显示标识点、名称、跟踪徽标、开关、提示词、状态 chip 与时间表描述。"},{"id":"A21","source":"brief.md","text":"切换开关即时生效；请求失败时回滚到原状态并提示原因。"},{"id":"A22","source":"brief.md","text":"运行中 chip 用绿色系，错过用中性灰，失败用警示色。"},{"id":"A23","source":"brief.md","text":"运行状态轮询只作用于屏幕内可见行，离开页面即停。"},{"id":"A24","source":"brief.md","text":"编辑页可改名称、提示词、口吻、时间表，连接器只读并注明需在管理后台调整。"},{"id":"A25","source":"brief.md","text":"保存只提交被改动的字段。"},{"id":"A26","source":"brief.md","text":"频道运行中保存返回 409 时，顶部出现提示且已填内容全部保留。"},{"id":"A27","source":"brief.md","text":"频道列表的 `+` 新建入口可见，点击说明功能开发中，不提供保存路径。"},{"id":"A28","source":"brief.md","text":"首次启动无 token 进入连接页，Base URL 预填 `reachapi.niuma.art` 且可编辑。"},{"id":"A29","source":"brief.md","text":"连接时先 `/health` 再 `/api/v1/channels` 双验证，两者都通过才写入 Keychain。"},{"id":"A30","source":"brief.md","text":"任一验证失败给出对应原因，且不覆盖已有凭证。"},{"id":"A31","source":"brief.md","text":"所有 `/api/v1` 请求带 Bearer，且不访问 `/admin/api/*`。"},{"id":"A32","source":"brief.md","text":"断网时下拉刷新显示「当前无网络」，不出现任何历史内容。"},{"id":"A33","source":"brief.md","text":"客户端不缓存日报与素材内容；`lastSeenAt` 作为轮询基线独立命名与存储。"},{"id":"A34","source":"brief.md","text":"轮询总是带 `since`，并以响应中最大的 `created_at` 推进，不用本地时间。"},{"id":"A35","source":"brief.md","text":"分页参数永不为 0、负数或超过 100，且不缓存负 `cursor`。"},{"id":"A36","source":"brief.md","text":"`missedReason` 与 `error.code` 的未知值保留原始字符串，不丢弃。"},{"id":"A37","source":"brief.md","text":"「我的」包含收藏列表、界面语言与 Base URL 偏好、当前服务地址与更换凭证入口。"},{"id":"A38","source":"brief.md","text":"收藏仅存本机，不同步服务端，可取消收藏并进入对应日报。"},{"id":"A39","source":"brief.md","text":"单元测试覆盖 DTO 解码、时间解析、未知枚举保留、分页参数、`lastSeenAt` 推进、筛选去重、编辑只提交改动字段与 409 不丢输入。"},{"id":"A40","source":"brief.md","text":"`android/**` 相对改动前字